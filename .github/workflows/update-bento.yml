name: update bento

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:         # manual run from the actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch github stats
        run: python scripts/fetch_stats.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: add a personal access token as the STATS_TOKEN secret
          # to include private repos and private contributions
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: generate bento.svg
        run: python scripts/generate.py

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bento.svg stats.json
          git diff --cached --quiet || (git commit -m "chore: update bento stats" && git push)
